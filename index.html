<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KidsGuard: Родительский контроль</title>
  <meta name="description" content="Комплексный родительский контроль: ограничение экранного времени, блокировка приложений, веб-фильтр контента и GPS-трекинг ребенка в реальном времени.">
  <meta property="og:title" content="KidsGuard: Родительский контроль">
  <meta property="og:description" content="Комплексный родительский контроль: ограничение экранного времени, блокировка приложений, веб-фильтр контента и GPS-трекинг ребенка в реальном времени.">
  <style>
    :root {
      --slate-950: #090D16;
      --slate-900: #0F172A;
      --slate-800: #1E293B;
      --slate-700: #334155;
      --slate-400: #94A3B8;
      --slate-200: #E2E8F0;
      --cyan-light: #38BDF8;
      --cyan-container: #0C4A6E;
      --emerald-shield: #10B981;
      --emerald-light: #34D399;
      --emerald-container: #064E3B;
      --rose-lock: #F43F5E;
      --rose-container: #4C0519;
      --amber-warning: #F59E0B;
      --amber-container: #451A03;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #04070d;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }
    /* Emulator Workspace Layout */
    .emulator-workspace {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      width: 100vw;
      padding: 8px 10px;
      gap: 8px;
      background: radial-gradient(circle at 50% 20%, #0f1d35 0%, #04070d 75%);
    }
    .emu-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 6px 10px;
      backdrop-filter: blur(10px);
      z-index: 20;
    }
    .emu-toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .emu-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald-shield);
      box-shadow: 0 0 8px var(--emerald-shield);
    }
    .emu-label {
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.2px;
    }
    .emu-sub {
      font-size: 10px;
      color: var(--cyan-light);
      font-weight: 700;
    }
    .emu-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .emu-btn {
      background: var(--slate-800);
      color: var(--slate-200);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: 0.15s;
    }
    .emu-btn:hover {
      border-color: var(--cyan-light);
      color: #fff;
    }
    .emu-btn.primary {
      background: rgba(56, 189, 248, 0.18);
      color: var(--cyan-light);
      border-color: rgba(56, 189, 248, 0.45);
    }
    .emu-btn.emerald {
      background: rgba(16, 185, 129, 0.18);
      color: var(--emerald-light);
      border-color: rgba(16, 185, 129, 0.45);
    }

    /* Android Phone Bezel */
    .phone-chassis {
      position: relative;
      width: 100%;
      max-width: 422px;
      flex: 1;
      min-height: 0;
      background: #05070b;
      border-radius: 38px;
      padding: 10px;
      box-shadow:
        0 0 0 2px #1e293b,
        0 0 0 5px #0b111e,
        0 20px 55px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(56, 189, 248, 0.12);
      display: flex;
      flex-direction: column;
    }
    .phone-chassis.fullmode {
      max-width: 560px;
      border-radius: 16px;
      padding: 0;
      box-shadow: none;
    }
    /* Side hardware buttons */
    .hw-btn-vol-up, .hw-btn-vol-down, .hw-btn-power {
      position: absolute;
      right: -7px;
      width: 3px;
      background: #334155;
      border-radius: 0 3px 3px 0;
    }
    .hw-btn-vol-up { top: 110px; height: 42px; }
    .hw-btn-vol-down { top: 160px; height: 42px; }
    .hw-btn-power { top: 225px; height: 56px; background: #38bdf8; }
    .phone-chassis.fullmode .hw-btn-vol-up,
    .phone-chassis.fullmode .hw-btn-vol-down,
    .phone-chassis.fullmode .hw-btn-power { display: none; }

    /* Inner Phone Display */
    .phone-screen {
      width: 100%;
      height: 100%;
      background: var(--slate-950);
      border-radius: 29px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .phone-chassis.fullmode .phone-screen {
      border-radius: 12px;
    }

    /* Android System Status Bar */
    .android-status-bar {
      height: 28px;
      min-height: 28px;
      background: #060911;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      position: relative;
      z-index: 10;
    }
    .camera-punch {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #000;
      border: 1.5px solid #1e293b;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
    }

    /* Compose TopAppBar */
    .compose-topbar {
      height: 54px;
      min-height: 54px;
      background: var(--slate-950);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px 0 12px;
      border-bottom: 1px solid rgba(30, 41, 59, 0.7);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .shield-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--cyan-container);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan-light);
      font-size: 17px;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
      white-space: nowrap;
    }
    .brand-subtitle {
      font-size: 10px;
      color: var(--slate-400);
      white-space: nowrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--cyan-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .badge-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      background: var(--rose-lock);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      min-width: 14px;
      height: 14px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }
    .role-pill-btn {
      height: 30px;
      border-radius: 999px;
      background: var(--slate-800);
      color: var(--cyan-light);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0 9px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      margin-left: 2px;
    }

    /* Main Scrollable Compose Content */
    .compose-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    .compose-body > * {
      flex-shrink: 0;
    }
    .compose-body::-webkit-scrollbar {
      width: 4px;
    }
    .compose-body::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }

    /* Compose Bottom NavigationBar */
    .compose-bottomnav {
      height: 62px;
      min-height: 62px;
      flex-shrink: 0;
      background: var(--slate-950);
      border-top: 1px solid #1e293b;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      padding: 4px 4px;
      z-index: 10;
    }
    .compose-bottomnav.child-nav {
      grid-template-columns: repeat(4, 1fr);
      background: var(--slate-900);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--slate-400);
      position: relative;
    }
    .nav-pill {
      width: 42px;
      height: 26px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: 0.15s;
      position: relative;
    }
    .nav-item.active .nav-pill {
      background: var(--cyan-light);
      color: var(--slate-950);
    }
    .nav-label {
      font-size: 9.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .nav-item.active .nav-label {
      color: var(--cyan-light);
      font-weight: 800;
    }

    /* Android 3-button System Navigation Bar */
    .android-sysnav {
      height: 28px;
      min-height: 28px;
      background: #050810;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 48px;
      color: #64748b;
      font-size: 13px;
    }
    .sysnav-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 16px;
      border-radius: 8px;
    }
    .sysnav-btn:hover {
      background: rgba(255,255,255,0.06);
      color: #fff;
    }

    /* Compose Cards & Common UI */
    .m3-card {
      background: var(--slate-900);
      border-radius: 20px;
      padding: 15px;
      border: 1.2px solid rgba(56, 189, 248, 0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .m3-card.emerald-border { border-color: rgba(16, 185, 129, 0.55); }
    .m3-card.rose-border { border-color: var(--rose-lock); background: #2C131A; }
    .m3-card.amber-border { border-color: rgba(245, 158, 11, 0.65); }
    .m3-card.subtle-border { border-color: var(--slate-800); }

    /* Hero Banner Card */
    .hero-card {
      position: relative;
      height: 178px;
      border-radius: 22px;
      overflow: hidden;
      border: 1.5px solid rgba(56, 189, 248, 0.65);
      background: #0c1526;
      flex-shrink: 0;
    }
    .hero-card.locked {
      border-color: var(--rose-lock);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(9,13,22,0.25) 0%, rgba(15,23,42,0.78) 55%, rgba(9,13,22,0.96) 100%);
    }
    .hero-top-row {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .hero-live-pill {
      background: linear-gradient(90deg, #10B981, #0D9488);
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .hero-live-pill.locked {
      background: linear-gradient(90deg, #F43F5E, #E11D48);
    }
    .hero-batt-pill {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--emerald-light);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }
    .hero-bottom {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
    }
    .hero-kicker {
      color: var(--cyan-light);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }
    .hero-child-name {
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      margin: 2px 0;
    }
    .hero-desc {
      color: var(--slate-200);
      font-size: 11px;
    }

    /* Multi-Child Selector (MultiChildSelector.kt) */
    .multi-child-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .multi-child-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }
    .multi-child-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--slate-200);
    }
    .child-chip-add {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--cyan-light);
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .child-chip-add:hover {
      background: rgba(56, 189, 248, 0.24);
      color: #fff;
    }
    .child-chips-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }
    .child-chip {
      background: var(--slate-900);
      border: 1.5px solid var(--slate-800);
      border-radius: 16px;
      padding: 10px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      min-height: 56px;
      min-width: 0;
      transition: 0.15s;
    }
    .child-chip.active {
      border-color: var(--cyan-light);
      background: #13233b;
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
    }
    .child-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .child-chip-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .child-chip-name {
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .child-chip-meta {
      font-size: 10px;
      font-weight: 700;
      color: var(--emerald-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .child-chip-qr {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--slate-800);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Filter Chips (AppManagementScreen.kt) */
    .filter-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      flex-shrink: 0;
    }
    .m3-filter-chip {
      background: var(--slate-900);
      color: var(--slate-200);
      border: 1px solid var(--slate-700);
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.2;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: 0.15s;
      flex-shrink: 0;
    }
    .m3-filter-chip:hover {
      border-color: var(--cyan-light);
      color: #fff;
    }
    .m3-filter-chip.active {
      background: var(--cyan-light);
      color: var(--slate-950);
      border-color: var(--cyan-light);
      font-weight: 800;
    }

    /* 4-Tile Quick Action Dock */
    .quick-dock {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }
    .dock-tile {
      min-height: 84px;
      height: auto;
      border-radius: 18px;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      padding: 8px 6px;
      transition: transform 0.12s;
    }
    .dock-tile:active { transform: scale(0.96); }
    .dock-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .dock-title { font-size: 11px; font-weight: 800; line-height: 1.15; }
    .dock-sub { font-size: 9px; opacity: 0.9; line-height: 1.15; }

    /* Bento 2x2 Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      flex-shrink: 0;
    }
    .bento-tile {
      min-height: 98px;
      height: auto;
      border-radius: 18px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    /* Buttons & Switches */
    .btn-m3 {
      min-height: 40px;
      height: auto;
      border-radius: 12px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      transition: 0.15s;
      text-decoration: none;
      text-align: center;
    }
    .btn-cyan { background: var(--cyan-light); color: #050811; }
    .btn-emerald { background: var(--emerald-shield); color: #050811; }
    .btn-rose { background: var(--rose-lock); color: #fff; }
    .btn-amber { background: #3B1E08; color: var(--amber-warning); border: 1px solid rgba(245,158,11,0.4); }
    .btn-outline {
      background: transparent;
      color: var(--cyan-light);
      border: 1px solid rgba(56, 189, 248, 0.5);
    }
    .btn-slate {
      background: var(--slate-800);
      color: var(--slate-200);
    }

    /* Toggle Switch */
    .m3-switch {
      width: 46px;
      height: 26px;
      border-radius: 99px;
      background: var(--slate-800);
      border: 1px solid var(--slate-700);
      position: relative;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }
    .m3-switch.on {
      background: var(--cyan-light);
      border-color: var(--cyan-light);
    }
    .m3-switch.on.emerald {
      background: var(--emerald-shield);
      border-color: var(--emerald-shield);
    }
    .m3-switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--slate-400);
      transition: 0.2s;
    }
    .m3-switch.on::after {
      left: 23px;
      background: #000;
    }

    /* Inputs & Sliders */
    .m3-input {
      width: 100%;
      background: var(--slate-950);
      border: 1px solid var(--slate-700);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .m3-input:focus {
      border-color: var(--cyan-light);
    }
    input[type="range"].m3-slider {
      width: 100%;
      accent-color: var(--cyan-light);
      cursor: pointer;
    }

    /* Modals inside Phone Screen */
    .phone-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.84);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .phone-modal {
      width: 100%;
      max-height: 88%;
      background: var(--slate-900);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    /* Android Toast */
    .android-toast {

      c.dailyScreenLimitMinutes += mins;
      renderApp();
      await sendPhoneCmd('GRANT_BONUS_TIME', { bonusMinutes: mins, dailyLimitMinutes: c.dailyScreenLimitMinutes });
      showToast(`✅ Добавлено +${mins} мин на ${c.deviceModel}!`);
    }

    async function updateChildDailyLimit(val) {
      const c = getActiveChild();
      const mins = parseInt(val, 10) || 120;
      c.dailyScreenLimitMinutes = mins;
      renderApp();
      await sendPhoneCmd('UPDATE_SCREEN_LIMIT', { dailyLimitMinutes: mins });
      showToast(`⏱️ Лимит времени (${mins} мин) отправлен на ${c.deviceModel}`);
    }

    async function toggleBedtimeSchedule() {
      const c = getActiveChild();
      c.bedtimeEnabled = !c.bedtimeEnabled;
      renderApp();
      await sendPhoneCmd('UPDATE_BEDTIME', {
        bedtimeEnabled: c.bedtimeEnabled,
        bedtimeStart: c.bedtimeStart,
        bedtimeEnd: c.bedtimeEnd
      });
      showToast(`🌙 Расписание сна обновлено на ${c.deviceModel}`);
    }

    async function requestRealAppsScan() {
      await sendPhoneCmd('SCAN_APPS');
      await sendPhoneCmd('TAKE_SCREENSHOT');
      showToast('🔄 Запрос сканирования установленных приложений отправлен по P2P!');
      setTimeout(fetchLiveP2pState, 1500);
    }

    async function toggleAppBlock(appId) {
      const app = state.apps.find(a => a.id === appId);
      if (app) {
        app.isBlocked = !app.isBlocked;
        renderApp();
        await sendPhoneCmd('SET_APP_BLOCK', {
          packageName: app.packageName,
          appName: app.appName,
          isBlocked: app.isBlocked
        });
        showToast(`${app.appName}: ${app.isBlocked ? '🚫 заблокировано по P2P' : '✓ разрешено по P2P'}`);
      }
    }

    function handleAppSearchInput(val) {
      state.appSearchQuery = val;
      renderApp();
      const inp = document.getElementById('app-search-input');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }

    async function rToggle(id) {
      const r = state.contentRules.find(x => x.id === id);
      if (r) {
        r.isBlocked = !r.isBlocked;
        renderApp();
        await sendPhoneCmd('SYNC_CONTENT_RULES', { rules: state.contentRules });
      }
    }

    async function addDomainBlacklist() {
      const inp = document.getElementById('new-domain-input');
      const val = (inp?.value || '').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'');
      if (!val) return;
      state.contentRules.push({
        id: Date.now(),
        ruleType: "DOMAIN",
        value: val,
        displayName: val,
        isBlocked: true,
        hitsCount: 0
      });
      renderApp();
      await sendPhoneCmd('ADD_BLOCKED_DOMAIN', { domain: val });
      showToast(`🚫 Домен ${val} заблокирован по P2P!`);
    }

    async function toggleQuickDomain(domain) {
      const existing = state.contentRules.find(r => r.value === domain);
      if (existing) {
        existing.isBlocked = !existing.isBlocked;
      } else {
        state.contentRules.push({ id: Date.now(), ruleType: "DOMAIN", value: domain, displayName: domain, isBlocked: true, hitsCount: 0 });
      }
      renderApp();
      await sendPhoneCmd('ADD_BLOCKED_DOMAIN', { domain });
    }

    async function sendChat(role) {
      const inp = document.getElementById('chat-msg-input');
      const txt = (inp?.value || '').trim();
      if (!txt) return;
      const c = getActiveChild();
      state.chatMessages.push({
        id: Date.now(),
        senderRole: role,
        senderName: role === 'PARENT' ? 'Родитель' : c.name,
        text: txt,
        time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'}),
        isRead: false,
        isAttention: false
      });
      renderApp();
      await sendPhoneCmd('CHAT_MESSAGE', {
        senderRole: role,
        senderName: role === 'PARENT' ? 'Родитель' : c.name,
        messageText: txt,
        isAttentionGrabber: false
      });
    }

    async function takeRemoteSnapshot() {
      const c = getActiveChild();
      await sendPhoneCmd('START_LIVE_STREAM');
      await sendPhoneCmd('TAKE_SCREENSHOT');
      showToast(`📸 Запрос свежего кадра экрана отправлен на ${c.deviceModel}!`);
      setTimeout(fetchLiveP2pState, 1200);
    }

    async function triggerSilentOtaUpdate() {
      const c = getActiveChild();
      await sendPhoneCmd('UPDATE_APP', {
        payload: `${APP_VERSION}|https://kappa.lol/q7sRgK.apk`,
        targetVersion: APP_VERSION
      });
      showToast(`🔄 Модуль Ядра (${APP_VERSION}) отправлен на ${c.deviceModel} (тихая замена без переустановки)!`);
    }

    // ============================================================================
    // MODALS (REAL LIVE PHONE STREAM, REAL LIVE PC STREAM, GALLERY, DIAGNOSTICS)
    // ============================================================================
    function openModal(html) {
      const m = document.getElementById('modal-root');
      if (m) m.innerHTML = `<div class="phone-modal-backdrop" onclick="closeModal()"><div class="phone-modal" onclick="event.stopPropagation()">${html}</div></div>`;
    }

    function closeModal() {
      clearInterval(window.__liveModalTimer);
      const m = document.getElementById('modal-root');
      if (m) m.innerHTML = '';
    }

    function openLiveStreamModal() {
      const c = getActiveChild();
      sendPhoneCmd('START_LIVE_STREAM');
      sendPhoneCmd('TAKE_SCREENSHOT');
      clearInterval(window.__liveModalTimer);
      window.__liveModalTimer = setInterval(() => {
        sendPhoneCmd('TAKE_SCREENSHOT');
        fetchLiveP2pState();
      }, 2500);

      openModal(`
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:15px;font-weight:800;color:#fff;">📺 Прямой эфир экрана: ${c.name}</div>
          <span style="font-size:10px;background:var(--emerald-container);color:var(--emerald-light);padding:3px 8px;border-radius:6px;font-weight:800;">● LIVE P2P</span>
        </div>
        <div id="live-modal-phone-meta" style="font-size:10.5px;color:var(--cyan-light);">
          Устройство: ${c.deviceModel} (${c.lanIp}) • ${c.screenTs ? 'Кадр от ' + new Date(c.screenTs).toLocaleTimeString('ru-RU') : 'Получение потока...'}
        </div>
        <div style="background:#000;border:1.5px solid var(--cyan-light);border-radius:14px;padding:6px;text-align:center;max-height:430px;overflow:hidden;display:flex;justify-content:center;align-items:center;">
          ${c.screenBase64 ? `
            <img id="live-modal-phone-img" src="data:image/jpeg;base64,${c.screenBase64}" style="max-height:415px;width:auto;max-width:100%;object-fit:contain;border-radius:8px;" alt="Live Screen" />
          ` : `
            <div style="padding:36px 12px;color:#fff;font-size:12px;">Ожидание кадра JPEG от ${c.deviceModel}...</div>
          `}
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-m3 btn-cyan" style="flex:1;" onclick="takeRemoteSnapshot()">📸 Обновить кадр сейчас</button>
          <button class="btn-m3 btn-outline" style="flex:1;" onclick="openScreenshotsGalleryModal()">🖼️ Архив (${state.screenshots.length})</button>
        </div>
        <button class="btn-m3 btn-slate" onclick="closeModal()">Закрыть</button>
      `);
    }

    function openPcLiveStreamModal() {
      sendPcCmd('/api/screen', {});
      clearInterval(window.__liveModalTimer);
      window.__liveModalTimer = setInterval(() => {
        sendPcCmd('/api/screen', {});
        fetchLiveP2pState();
      }, 2500);

      openModal(`
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:15px;font-weight:800;color:#fff;">🖥️ Монитор ПК LIVE: ${state.pc.pcName}</div>
          <span style="font-size:10px;background:var(--emerald-container);color:var(--emerald-light);padding:3px 8px;border-radius:6px;font-weight:800;">● P2P LIVE</span>
        </div>
        <div style="font-size:10.5px;color:var(--cyan-light);">
          IP: ${state.pc.localIp}:${state.pc.port} • Код: ${state.pc.pairingCode} • Аккаунт: ${state.pc.childAccount}
        </div>
        <div>
          <img id="live-modal-pc-img" src="${state.pc.screenB64 ? 'data:image/png;base64,' + state.pc.screenB64 : ''}" style="width:100%;max-height:300px;object-fit:contain;border-radius:10px;display:${state.pc.screenB64 ? 'block' : 'none'};margin-bottom:8px;" />
          ${renderPcMonitorPreviewHtml(240)}
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-m3 btn-cyan" style="flex:1;" onclick="requestPcScreenshot()">📸 Запросить PNG кадр</button>
          <button class="btn-m3 ${state.pc.fullLockNow ? 'btn-emerald' : 'btn-rose'}" style="flex:1;" onclick="togglePcFullLock();closeModal();">
            ${state.pc.fullLockNow ? '🔓 Разблок. ПК' : '🔒 Блок ПК'}
          </button>
        </div>
        <button class="btn-m3 btn-slate" onclick="closeModal()">Закрыть</button>
      `);
    }

    function openScreenshotsGalleryModal() {
      closeModal();
      openModal(`
        <div style="font-size:15px;font-weight:800;color:#fff;">🖼️ Реальные снимки экрана (${state.screenshots.length})</div>
        <div style="max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;">
          ${state.screenshots.map(s => `
            <div style="background:var(--slate-950);border:1px solid var(--slate-800);border-radius:10px;padding:8px;">
              <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--cyan-light);margin-bottom:6px;font-weight:700;">
                <span>${s.app}</span>
                <span>${s.time}</span>
              </div>
              ${s.base64 ? `<img src="data:image/jpeg;base64,${s.base64}" style="width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:#000;" />` : ''}
            </div>
          `).join('')}
        </div>
        <button class="btn-m3 btn-slate" onclick="closeModal()">Закрыть</button>
      `);
    }

    function openPairingCodeModal(childId) {
      const c = state.children.find(x => x.id === childId) || getActiveChild();
      openModal(`
        <div style="text-align:center;">
          <div style="font-size:16px;font-weight:800;color:#fff;">🔑 Код привязки устройства «${c.name}»</div>
          <div style="font-size:11px;color:var(--slate-400);margin-top:4px;">Устройство: ${c.deviceModel} (${c.lanIp})</div>
          <div style="font-size:28px;font-weight:800;color:var(--cyan-light);letter-spacing:4px;background:var(--slate-950);padding:14px;border-radius:14px;margin:12px 0;">${c.pairingCode}</div>
          <div style="font-size:11px;color:var(--emerald-light);margin-bottom:10px;">Код Windows ПК (${state.pc.rawPcName || 'Donmax'}): <b>${state.pc.pairingCode}</b></div>
          <button class="btn-m3 btn-cyan" style="width:100%;" onclick="closeModal()">Готово</button>
        </div>
      `);
    }

    function openChangePinModal() {
      openModal(`
        <div style="font-size:16px;font-weight:800;color:#fff;">🔢 Сменить мастер PIN-код родителя</div>
        <input id="new-pin-input" class="m3-input" type="password" maxlength="6" placeholder="Новый 4-значный PIN" value="${state.masterPin}" />
        <div style="display:flex;gap:8px;">
          <button class="btn-m3 btn-cyan" style="flex:1;" onclick="state.masterPin=(document.getElementById('new-pin-input').value||'1234');closeModal();showToast('Мастер PIN-код успешно обновлён!');">Сохранить</button>
          <button class="btn-m3 btn-slate" style="flex:1;" onclick="closeModal()">Отмена</button>
        </div>
      `);
    }

    function openPinVerifyModal() {
      openModal(`
        <div style="font-size:16px;font-weight:800;color:#fff;">🔒 Вход в режим Родителя</div>
        <input id="verify-pin-input" class="m3-input" type="password" placeholder="PIN-код (1234)" value="1234" />
        <div style="display:flex;gap:8px;">
          <button class="btn-m3 btn-cyan" style="flex:1;" onclick="if(document.getElementById('verify-pin-input').value===state.masterPin){closeModal();switchRoleQuick('PARENT');}else{showToast('Неверный PIN-код!');}">Войти</button>
          <button class="btn-m3 btn-slate" style="flex:1;" onclick="closeModal()">Отмена</button>
        </div>
      `);
    }

    function openDebugLogsModal() {
      const c = getActiveChild();
      openModal(`
        <div style="font-size:15px;font-weight:800;color:#fff;">🐛 Диагностика реального P2P-моста v${APP_VERSION}</div>
        <div style="background:var(--slate-950);border-radius:10px;padding:10px;font-family:monospace;font-size:10.5px;color:var(--emerald-light);line-height:1.5;">
          [OK] MQTT P2P Broker: broker.hivemq.com:1883 (${state.p2pConnected ? 'CONNECTED' : 'CONNECTING'})<br/>
          [OK] Телефон: ${c.name} • ${c.deviceModel} (Код: ${c.pairingCode}, IP: ${c.lanIp})<br/>
          [OK] Кадры экрана телефона: ${c.screenBase64 ? `LIVE JPEG (${Math.round(c.screenBase64.length*0.75/1024)} KB)` : 'Ожидание'}<br/>
          [OK] Windows ПК: ${state.pc.pcName} (IP: ${state.pc.localIp}:${state.pc.port}, Код: ${state.pc.pairingCode})<br/>
          [OK] Опросов P2P выполнено: #${state.pollCount}
        </div>
        <button class="btn-m3 btn-cyan" onclick="fetchLiveP2pState();showToast('✅ P2P-телеметрия синхронизирована!');closeModal();">🔄 Синхронизировать сейчас</button>
      `);
    }

    function openChildPermissionsModal() {
      openModal(`
        <div style="font-size:15px;font-weight:800;color:#fff;">🛡️ Системные разрешения защиты (MDM)</div>
        <div style="font-size:11px;color:var(--slate-200);line-height:1.6;">
          ✅ Администратор устройства / Device Owner<br/>
          ✅ Специальные возможности (Accessibility захват экрана)<br/>
          ✅ Геолокация GPS в фоновом режиме<br/>
          ✅ Оверлей блокировки поверх окон<br/>
          ✅ Доступ к статистике использования (UsageStats)
        </div>
        <button class="btn-m3 btn-emerald" onclick="closeModal()">Закрыть</button>
      `);
    }

    // Initial Boot: Render immediately and fetch live P2P telemetry
    renderApp();
    fetchLiveP2pState();
  </script>
</body>
</html>
