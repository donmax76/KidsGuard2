name: Build KidsGuard APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Версия из gradle/wrapper/gradle-wrapper.properties (обёртки gradlew в репозитории нет)
          gradle-version: '9.3.1'

      - name: Generate debug keystore (if absent)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Publish build error log (diagnostics)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build-output.log', 'utf8'); } catch (e) {}
            const lines = log.split('\n');
            const errs = lines.filter(l =>
              l.startsWith('e: ') ||
              l.includes('e: file://') ||
              l.includes('error: ') ||
              l.includes('Unresolved reference') ||
              l.includes('Type mismatch') ||
              l.includes('None of the following') ||
              l.includes('Compilation error')
            ).slice(0, 250);
            const tail = lines.slice(-120).join('\n');
            const body = '### Compiler errors\n```\n' + (errs.join('\n') || 'no e: lines') +
              '\n```\n### Tail\n```\n' + tail + '\n```';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI build error',
              body: body
            });

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
