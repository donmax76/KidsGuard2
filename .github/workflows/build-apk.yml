name: Build KidsGuard APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Версия из gradle/wrapper/gradle-wrapper.properties (обёртки gradlew в репозитории нет)
          gradle-version: '9.3.1'

      - name: Generate debug keystore (if absent)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Publish build error log (diagnostics)
        if: failure()
        run: |
          git config user.name "ci-diagnostics"
          git config user.email "ci@users.noreply.github.com"
          {
            echo "sha: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "---"
            tail -n 300 build-output.log 2>/dev/null || true
          } > build-error.log
          git checkout -B ci-build-log
          git add build-error.log
          git commit -m "ci: build error for $GITHUB_SHA" || exit 0
          git push --force origin ci-build-log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsGuard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
